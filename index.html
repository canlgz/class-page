<!--
  備份機器人的課堂頁面（LIFF）。
  學生：歷程／檔案／我的（含改暱稱、戳戳老師）。老師：總覽／歷程（可廣播）／檔案／繳交／設定。
  資料全部來自 GAS 的 ?api=liff 接口（src/liffApi.js、src/liffActions.js）；這個頁面本身不含任何 token，
  誰是老師、誰能看什麼都由後端決定。
  config.js 未填、或網址帶 ?demo（老師版：?demo=teacher）時，以假資料示範，不連 LINE 也不連 GAS。
-->
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
</head>

async function realApi(action,body={}){
  const stop=new AbortController(),timer=setTimeout(()=>stop.abort(),action==='summaryRefresh'?270000:25000);
  let reply;
  try{
    // text/plain keeps this a "simple" request: GAS web apps cannot answer a CORS preflight.
    const res=await fetch(CFG.api+'?api=liff',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({...body,action,idToken:auth.idToken,course:auth.course}),signal:stop.signal,redirect:'follow'});
    reply=await res.json();
  }catch(error){throw Object.assign(new Error(error.name==='AbortError'?'等太久了，機器人沒有回應。':'連不上機器人，請檢查網路。'),{code:'network'});}
  finally{clearTimeout(timer);}
  if(!reply.ok)throw Object.assign(new Error(reply.message||'發生錯誤'),{code:reply.error,retryAt:reply.retryAt});
  return reply.data;
}

async function demoApi(action,b={}){
  await new Promise(r=>setTimeout(r,500));
  if((!demo.teacher||b.asStudent)&&['overview','handin','courses','saveSettings','broadcast','meetSave','meetSend','meetCreate','schedule','scheduleSave','summaries','summaryRefresh'].includes(action))
    throw Object.assign(new Error('這個功能只有老師能用。'),{code:'teacher_only'});
  const pub=({...r})=>r;
  switch(action){
    case 'init':return {course:DEMO_COURSES.find(c=>c[0]===demo.course)[1]===DEMO_COURSES[0][1]?demo.name:DEMO_COURSES.find(c=>c[0]===demo.course)[1],
      nickname:demo.nick,teacher:demo.teacher,version:'示範',week1:demo.week1||monday(taipei(-66)),...(demo.teacher?{forward:demo.forward,week1Auto:!demo.week1,week1Start:taipei(-66)}:{})};
    case 'me':{const m=FAKE.filter(r=>r.mine);return {messages:m.filter(r=>!r.upload).length,files:m.filter(r=>r.upload).length,last:{day:m[0].day,time:m[0].time}};}
    case 'file':return {name:FAKE.find(r=>r.row===b.row).text,url:''};
    case 'overview':{const t=FAKE.filter(r=>r.day===today);
      return {today:{messages:t.filter(r=>!r.upload).length,uploads:t.filter(r=>r.upload).length,people:new Set(t.map(r=>r.who)).size,last:t[0].time},
        week:[-6,-5,-4,-3,-2,-1,0].map(d=>({day:taipei(d),count:FAKE.filter(r=>r.day===taipei(d)).length})),
        meet:demoMeeting().meet,schedule:demoMeeting().schedule,roster:DEMO_PEOPLE.map((who,i)=>{const a=FAKE.filter(r=>r.who===who);return {person:i+3,who,messages:a.filter(r=>!r.upload).length,files:a.filter(r=>r.upload).length,last:a[0]?{day:a[0].day,time:a[0].time}:null};})
          .sort((x,y)=>y.messages+y.files-x.messages-x.files)};}
    case 'handin':{const done=[],missing=[];DEMO_PEOPLE.forEach((who,i)=>{const r=FAKE.find(x=>x.who===who&&x.upload&&x.day>=b.from&&x.day<=b.to);
      r?done.push({person:i+3,who,file:r.text,day:r.day,time:r.time}):missing.push({person:i+3,who});});return {from:b.from,to:b.to,done,missing};}
    case 'courses':return DEMO_COURSES.map(c=>({code:c[0],name:c[0]==='a'?demo.name:c[1],current:c[0]===demo.course,last:{day:taipei(c[2]),time:c[3]}}));
    case 'nickname':if(String(b.name).trim().length<2)throw Object.assign(new Error('暱稱至少要兩個字。'),{code:'invalid'});{const old=demo.nick;demo.nick=b.name.trim();FAKE.forEach(r=>{if(r.mine)r.who=demo.nick;});DEMO_PEOPLE[0]=demo.nick;return {nickname:demo.nick,records:FAKE.filter(r=>r.mine).length*(old!==demo.nick),replies:0};}
    case 'poke':return {sent:true};
    case 'saveSettings':if(b.name!=null)demo.name=b.name;if(b.forward!=null)demo.forward=b.forward;if(b.week1!=null)demo.week1=b.week1&&monday(b.week1);return {name:demo.name,forward:demo.forward,...(b.week1!=null?{week1:demo.week1||monday(taipei(-66)),week1Auto:!demo.week1}:{})};
    case 'broadcast':return {sent:b.rows.length};
    case 'schedule':{const {schedule}=demoMeeting();
      return {schedule,suggestion:!schedule&&demo.course==='a'?{day:3,start:'13:20',end:'16:20',mode:'online'}:null};}
    case 'scheduleSave':{
      const {day,start,end,mode}=b,minutes=t=>typeof t==='string'&&/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(t)?+t.slice(0,2)*60+ +t.slice(3):NaN;
      const duration=minutes(end)-minutes(start);
      if(!Number.isInteger(day)||day<1||day>7||!(duration>=30&&duration<=300)||!['online','onsite'].includes(mode))
        throw Object.assign(new Error('請選擇星期、上課方式及開始和結束時間，上課長度須為 30 分鐘到 5 小時。'),{code:'invalid'});
      const meeting=demoMeeting(),weekly=meeting.weekly;
      meeting.schedule={day,start,end,mode};
      const created=mode==='online'&&(!weekly||weekly.day!==day||weekly.start!==start||weekly.end!==end);
      if(created){meeting.weekly=meeting.schedule;meeting.meet=demoMeetUrl();}
      return {schedule:meeting.schedule,meet:meeting.meet,created};
    }
    case 'meetSave':{const m=/^(?:https?:\/\/)?meet\.google\.com\/([a-z]{3}-[a-z]{4}-[a-z]{3})(?:[/?#].*)?$/i.exec(String(b.url||'').trim());
      if(String(b.url||'').trim()===''){demoMeeting().meet='';return {meet:''};}
      if(!m)throw Object.assign(new Error('請貼上 Google Meet 的會議連結，例如 https://meet.google.com/abc-defg-hij'),{code:'invalid'});
      const meet='https://meet.google.com/'+m[1].toLowerCase();demoMeeting().meet=meet;return {meet};}
    case 'meetCreate':{const meet=demoMeetUrl();demoMeeting().meet=meet;return {meet};}
    case 'meetSend':throw Object.assign(new Error('請在群組裡打 //會議，機器人會用回覆貼出連結（不花訊息額度）。'),{code:'use_reply'});
    case 'summaries':return demoSummaries();
    case 'summaryRefresh':{
      const day=b.monday||monday(today);
      const updated=demoSummaries().weeks.find(w=>w.monday===day);
      if(!updated)throw Object.assign(new Error('請選擇這學期已開始的週次。'),{code:'bad_request'});
      const latest=demoSummaryRefreshes.get(demo.course)||{retry:0,weeks:new Map()};
      if(Date.now()<latest.retry)throw Object.assign(new Error('這堂課每 10 分鐘可手動更新一次。'),
        {code:'rate_limited',retryAt:new Date(latest.retry).toISOString()});
      updated.made=new Date().toISOString();latest.weeks.set(day,updated.made);
      latest.retry=Date.now()+600000;demoSummaryRefreshes.set(demo.course,latest);
      return updated;
    }
    default:if(typeof demoRoll==='function'){const r=demoRoll(action,b);if(r!==undefined)return r;}
  }
  const q=(b.q||'').trim().toLowerCase(),size=5,start=b.offset||0,person=b.person!=null?DEMO_PEOPLE[b.person-3]:'';
  const f=FAKE.filter(r=>(!b.mine||r.mine)&&(!b.day||r.day===b.day)&&(!person||r.who===person)&&(b.kind!=='text'||r.type==='text')&&(b.kind!=='upload'||r.upload)&&(b.kind!=='doc'||r.type==='file')
    &&(b.kind!=='media'||(r.upload&&r.type!=='file'))&&(!q||(r.text+r.who).toLowerCase().includes(q)));
  const items=f.slice(start,start+size).map(pub);
  return {total:f.length,items,next:start+items.length<f.length?start+items.length:null};
}

function summaryTalk(w){
  const s=w.summary;
  if(!s)return w.low?summaryLow(w):'';
  return summaryNotices(w,false)+summaryFormative(w)+summaryPending(s.pending,5)+s.threads.map((t,i)=>{
    const who=[...new Set([t.starter,...t.positions.flatMap(p=>p.who)].filter(Boolean))];
    return `<details class="summary-thread"${i===0?' open':''}>
      <summary><span class="grow"><strong>${esc(t.title)}</strong>
        <span class="hint">${t.starter?`由 ${esc(t.starter)} 開始・`:''}${who.length?who.length+' 人・':''}${SUMMARY_OUTCOME[t.outcome]||''}</span></span>
        <span class="hint num">${esc(summarySpan(t.from,t.to))}</span></summary>
      ${t.positions.map(p=>`<div class="summary-view"><p>${esc(p.view)}</p>
        ${p.who.length?`<p class="hint">${esc(p.who.slice(0,4).join('、'))}${p.who.length>4?` 等 ${p.who.length} 人`:''}</p>`:''}</div>`).join('')}
      ${t.note?`<p class="summary-outcome">→ ${esc(t.note)}</p>`:''}
      <button type="button" class="linkbtn summary-source" data-summary-log="${esc(summaryIso(w,t.from.slice(0,5)))}">看這天的原始對話</button>
    </details>`;}).join('')+
    (w.low?summaryLow(w):w.loose?`<p class="hint summary-message">另有 ${w.loose} 則零散訊息，${w.looseDone?'已併入上面的形成性摘要。':summaryLive(w)?'週結束後會合成一份形成性摘要。':'還沒有納入摘要。'}</p>`:'');

async function loadSummary(mine){
  const box=$('weeklySummary');skeleton(box,[76]);
  try{
    const data=await api('summaries');
    if(mine!==seq)return;
    // An older backend answers in another shape; without `fresh` this page cannot draw it.
    if(data.weeks.length&&!('fresh' in data.weeks[0])){box.remove();return;}
    S.summaryData=data;box.removeAttribute('aria-busy');summaryHome();
  }catch(error){
    if(mine!==seq)return;
    if(error.code==='bad_request'){box.remove();return;}
    box.removeAttribute('aria-busy');box.innerHTML=problem(error,'summary');
  }
}

function summaryScreen(){
  const {weeks,configured,minMessages}=S.summaryData,view=S.summaryView;
  const returnButton=(target,label)=>`<button type="button" class="btn summary-return" data-summary-view="${target}">‹ ${label}</button>`;
  if(view==='weeks'){
    main.innerHTML=returnButton('home','返回總覽')+`<h2 class="summary-list-title">各週摘要</h2>
      <div class="summary-weeks">${weeks.map(w=>`<button type="button" class="tile summary-week" data-summary-view="${esc(w.monday)}">

          <span class="summary-week-line">${w.summary?esc(w.summary.headline):w.low?'少於 '+minMessages+' 則，直接列出':configured?'摘要尚未產生':'尚未設定 OpenAI 金鑰'}</span>

    </div>`;

async function refreshSummary(day,btn,force){
  const mine=seq,label=btn.innerHTML;
  btn.disabled=true;btn.setAttribute('aria-busy','true');
  btn.innerHTML='<span class="summary-spinner" aria-hidden="true"></span>產生中…';
  try{
    const w=await api('summaryRefresh',force?{monday:day,force:true}:{monday:day});
    if(mine!==seq)return;
    const weeks=S.summaryData.weeks;
    weeks[weeks.findIndex(item=>item.monday===w.monday)]=w;
    S.summaryView?summaryScreen():summaryHome();
    main.querySelector('[data-summary-refresh]')?.focus({preventScroll:true});
    if(w.error)toast(w.error,'alert');
    else toast(w.summary?'摘要已更新':'這週還沒有可以摘要的討論');
  }catch(error){
    if(mine!==seq)return;
    const message=error.code==='rate_limited'&&error.retryAt?error.message+' 請於 '+summaryTime(error.retryAt)+' 後再按。'
      :error.code==='not_configured'?SUMMARY_SETUP:error.message;
    toast(message,'alert');
  }finally{
    btn.disabled=false;btn.removeAttribute('aria-busy');btn.innerHTML=label;
  }
}

function summaryRefreshClick(day,btn){
  const w=S.summaryData.weeks.find(item=>item.monday===day);
  if(summaryLive(w)){refreshSummary(day,btn,false);return;}
  const close=sheet(`<h3 id="sheetTitle">重新產生 ${esc(w.w)} 的摘要？</h3>
    <p class="hint">這一週的每段討論都會重新送 AI 摘要，並取代現在的內容。</p>
    <div class="row"><button type="button" class="btn" data-close>取消</button>
    <button type="button" class="btn primary" id="summaryConfirm">重新產生</button></div>`);
  $('summaryConfirm').addEventListener('click',()=>{close();refreshSummary(day,btn,true);});
}

      <div class="tile"><div class="k">上傳檔案</div><div class="v">${me.files} <small>個</small></div></div></div>
      <p class="hint">${me.last?`最後一次被備份：${when(me.last)}。這裡看得到，就代表老師那邊也有紀錄。`:'還沒有紀錄。'}</p>`;
  }catch(error){box.innerHTML=problem(error,'view');}
}
// Monday-to-Sunday weeks, on Taipei days.
function range(){
  const weekday=(new Date(today+'T00:00:00Z').getUTCDay()+6)%7;
  if(S.range==='today')return [today,today];
  if(S.range==='this')return [taipei(-weekday),today];
  if(S.range==='last')return [taipei(-weekday-7),taipei(-weekday-1)];
  return [S.from||taipei(-6),S.to||today];
}
async function fillHand(from,to){
  const box=$('hand'),mine=++seq;skeleton(box,[76,56,56]);
  try{
    const r=await api('handin',{from,to});if(mine!==seq)return;box.removeAttribute('aria-busy');
    box.innerHTML=`<div class="tiles"><div class="tile"><div class="k">已上傳</div><div class="v">${r.done.length} <small>人</small></div></div>
        <div class="tile"><div class="k">尚未上傳</div><div class="v">${r.missing.length} <small>人</small></div></div></div>
      <h2>尚未上傳</h2>${r.missing.length?`<ul class="list">${r.missing.map(p=>`<li><div class="grow"><b>${esc(p.who)}</b></div><span class="tag no">${ic('x')}未交</span></li>`).join('')}</ul>`
        :empty(r.done.length?'名單上的每個人都上傳過檔案。':'名單上還沒有學生。')}
      <h2>已上傳</h2>${r.done.length?`<ul class="list">${r.done.map(p=>`<li><div class="grow"><b>${esc(p.who)}</b><div class="meta"><span>${esc(p.file)}</span><span class="num">${dayLabel(p.day)} ${p.time}</span></div></div><span class="tag ok">${ic('ok')}已交</span></li>`).join('')}</ul>`
        :empty('這段期間還沒有人上傳檔案。')}
      <p class="hint">以「這段期間有沒有上傳任何檔案、圖片或影音」判斷，不檢查內容；只列出這學期（W1 之後）在群組發言過的人。</p>`;
  }catch(error){if(mine!==seq)return;box.removeAttribute('aria-busy');box.innerHTML=problem(error,'view');}
}

// ---------- dialog ----------
function sheet(html){
  const back=document.activeElement;
  $('overlay').innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">${html}</div></div>`;
  const onKey=e=>{if(e.key==='Escape')close();};
  function close(){$('overlay').innerHTML='';document.removeEventListener('keydown',onKey);if(back&&back.isConnected)back.focus();}
  document.addEventListener('keydown',onKey);
  $('overlay').querySelector('.scrim').addEventListener('click',e=>{if(e.target.classList.contains('scrim')||e.target.closest('[data-close]'))close();});
  const first=$('overlay').querySelector('input,button');if(first)first.focus();
  return close;
}
async function castDialog(){
  const picked=[...S.picked];
  const close=sheet(`<h3 id="sheetTitle">廣播 ${picked.length} 則訊息</h3>
    <ul class="list" style="margin:8px 0 16px">${picked.map(([,label])=>`<li><div class="text" style="font-size:14px">${esc(label.slice(0,80))}</div></li>`).join('')}</ul>
    <div id="castTargets"><div class="sk" style="height:96px"></div></div>
    <p class="err" id="castErr" role="alert" hidden></p>
    <div class="row"><button type="button" class="btn" data-close>取消</button><button type="button" class="btn primary" id="castGo" disabled>${ic('send')}確認廣播</button></div>`);
  try{
    if(!S.courses)S.courses=await api('courses');if(!$('castTargets'))return;
    const others=S.courses.filter(c=>!c.current);
    $('castTargets').innerHTML=others.length?`<p class="hint" style="margin-bottom:4px">送到哪個群組？按下確認後才會送出，送出後無法收回。</p>
      <div role="radiogroup" aria-label="目標群組">${others.map(c=>`<label class="radio"><input type="radio" name="to" value="${c.code}"><span>${esc(c.name)}</span></label>`).join('')}</div>`
      :'<p class="hint">沒有其他群組可以廣播。</p>';
    $('castTargets').addEventListener('change',()=>{$('castGo').disabled=false;});
  }catch(error){$('castTargets').innerHTML=problem(error,'none');}
  $('castGo').addEventListener('click',e=>busy(e.currentTarget,async()=>{
    const to=document.querySelector('input[name=to]:checked');
    try{
      const done=await api('broadcast',{rows:picked.map(p=>p[0]),target:to.value});
      close();S.select=false;S.picked.clear();render();
      toast('已把 '+done.sent+' 則訊息廣播到「'+S.courses.find(c=>c.code===to.value).name+'」');
    }catch(error){const el=$('castErr');el.textContent=error.message;el.hidden=false;}
  }));
}

// ---------- events ----------
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;S.summaryView='';S.day='';S.select=false;S.picked.clear();render();main.focus({preventScroll:true});});
let deb;
main.addEventListener('input',e=>{if(e.target.id!=='q')return;S.q=e.target.value;clearTimeout(deb);deb=setTimeout(()=>fillList($('list'),logParams(),LOG_EMPTY),500);});
main.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.pick){
    const id=+t.dataset.pick;
    if(t.checked&&S.picked.size>=5){t.checked=false;return toast('一次最多廣播 5 則','alert');}
    t.checked?S.picked.set(id,t.dataset.label):S.picked.delete(id);actionbar();
  }else if(t.id==='from'||t.id==='to'){
    S.from=$('from').value;S.to=$('to').value;
    if(S.from&&S.to&&S.from<=S.to)fillHand(S.from,S.to);else toast('開始日期要早於或等於結束日期','alert');
  }else if(t.name==='course'){
    auth.course=t.value;demo.course=t.value;S.courses=null;S.person=null;S.q='';
    if(!DEMO)history.replaceState(null,'','?c='+encodeURIComponent(t.value));
    await boot('set');if(S.info)toast('已切換到「'+S.info.course+'」');
  }
});
main.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if('summaryView' in d||'summaryNeighbor' in d){
    const to=d.summaryView||d.summaryNeighbor;
    if(d.summaryView&&to!=='home'&&to!=='weeks')S.summaryBack=S.summaryView==='weeks'?'weeks':'home';
    S.summaryView=to==='home'?'':to;render();main.focus({preventScroll:true});return;
  }
  if('summaryRefresh' in d){summaryRefreshClick(d.summaryRefresh,t);return;}
  if('summaryTab' in d){S.summaryTab=d.summaryTab;summaryScreen();$('summaryTab-'+d.summaryTab)?.focus({preventScroll:true});return;}
  if('summaryLog' in d){S.tab='log';S.summaryView='';S.day=d.summaryLog;S.q='';S.kind='all';S.person=null;render();main.focus({preventScroll:true});return;}
  if('unday' in d){S.day='';render();return;}
  if('summaryMore' in d){
    const box=$(d.summaryMore),open=t.getAttribute('aria-expanded')==='true';
    box.classList.toggle('summary-fold',open);t.setAttribute('aria-expanded',String(!open));t.textContent=open?'展開全文':'收合';return;
  }
  if('summaryAll' in d){
    const expanded=t.getAttribute('aria-expanded')==='true';
    $('summaryPeople').querySelectorAll('[data-summary-extra]').forEach(row=>{row.hidden=expanded;});
    t.setAttribute('aria-expanded',String(!expanded));
    t.textContent=expanded?`顯示全部 ${d.summaryAll} 人`:'收合至前 8 人';
    return;
  }
  if('meetshare' in d){meetShareDialog();return;}
  if('scheduleopen' in d){$('tabs').querySelector('[data-tab="set"]').click();return;}
  if('meetnew' in d){meetCreate(t);return;}
  if('meetedit' in d){S.meetEdit=true;meetRepaint();$('meetUrl').focus();return;}
  if('meetcancel' in d){S.meetEdit=false;meetRepaint();return;}
  if('meetremove' in d){busy(t,async()=>{try{await api('meetSave',{url:''});S.meet='';S.meetEdit=false;meetRepaint();toast('已移除會議連結');}catch(error){toast(error.message,'alert');}});return;}
  if('kind' in d){S.kind=d.kind;render();}
  else if('fkind' in d){S.fileKind=d.fkind;render();}
  else if('range' in d){S.range=d.range;render();}
  else if('unperson' in d){S.person=null;render();}
  else if('select' in d){S.select=!S.select;S.picked.clear();render();}
  else if('person' in d){S.person={id:+d.person,name:d.name};S.kind='all';S.q='';S.tab='log';render();}
  else if('cast' in d){castDialog();}
  else if('week1auto' in d){busy(t,async()=>{try{const r=await api('saveSettings',{week1:''});S.info.week1=r.week1;S.info.week1Auto=r.week1Auto;render();toast('已改回自動判斷：W1 從 '+r.week1+' 那一週開始');}catch(error){toast(error.message,'alert');}});}
  else if('preview' in d){S.preview=true;S.tab='me';header();render();main.focus({preventScroll:true});}
  else if('retry' in d){if(d.retry==='summary')loadSummary(seq);else d.retry==='boot'?boot():render();}
  else if('more' in d){
    const box=$('list'),params={...JSON.parse(box.dataset.params),offset:+d.more},label=t.innerHTML;
    t.disabled=true;t.textContent='載入中…';
    try{const data=await api('log',params);t.remove();
      // Continue the day the previous page ended on instead of repeating its heading.
      box.insertAdjacentHTML('beforeend',grouped(data.items,box.dataset.lastDay)+more(data));box.dataset.lastDay=data.items.at(-1).day;
    }catch(error){t.disabled=false;t.innerHTML=label;toast(error.message,'alert');}
  }
  else if('get' in d){
    busy(t,async()=>{
      try{
        const file=await api('file',{row:+d.get});
        if(DEMO)toast('示範模式：正式版會開啟「'+d.name+'」');
        else if(window.liff&&liff.isInClient())liff.openWindow({url:file.url,external:true});
        else location.href=file.url;
      }catch(error){toast(error.message,'alert');}
    });
  }
});
main.addEventListener('submit',e=>{
  e.preventDefault();const form=e.target,btn=form.querySelector('[type=submit]');
  const fail=(errId,fieldId,text)=>{const el=$(errId);el.textContent=text;el.hidden=false;$(fieldId).setAttribute('aria-invalid','true');$(fieldId).focus();};
  const clear=(errId,fieldId)=>{$(errId).hidden=true;$(fieldId).removeAttribute('aria-invalid');};
  if(form.id==='meetForm'){
    const v=$('meetUrl').value.trim();
    if(!v)return fail('meetErr','meetUrl','請貼上 Google Meet 的會議連結。');
    busy(btn,async()=>{try{const r=await api('meetSave',{url:v});S.meet=r.meet;S.meetEdit=false;meetRepaint();toast('已儲存會議連結');}
      catch(error){fail('meetErr','meetUrl',error.message);}});
    return;
  }
  if(form.id==='scheduleForm'){
    const schedule={day:+$('scheduleDay').value,start:$('scheduleStart').value,end:$('scheduleEnd').value,mode:$('scheduleMode').value};
    const status=$('scheduleStatus'),message=$('scheduleError');
    status.hidden=true;message.hidden=true;
    return busy(btn,async()=>{
      try{
        const r=await api('scheduleSave',schedule);if($('scheduleForm')!==form)return;
        $('scheduleSuggestion').hidden=true;
        status.textContent=r.created?'已建立每週固定的會議連結':'上課時間已儲存';
        status.hidden=false;
        if(r.meetError){message.textContent=r.meetError;message.hidden=false;}
      }catch(error){
        if($('scheduleForm')===form){message.textContent=error.message;message.hidden=false;}
      }
    });
  }
  if(form.id==='nickForm'){
    const v=$('nick').value.trim();
    if(v.length<2)return fail('nickErr','nick','暱稱至少要兩個字。');
    busy(btn,async()=>{try{const r=await api('nickname',{name:v});S.info.nickname=r.nickname;header();clear('nickErr','nick');toast('暱稱已改為「'+r.nickname+'」'+(r.records?'，之前的 '+r.records+' 則紀錄也一併更新':''));}
      catch(error){fail('nickErr','nick',error.message);}});
  }else if(form.id==='pokeForm'){
    const v=$('poke').value.trim();
    if(!v)return fail('pokeErr','poke','請先寫下想跟老師說的話。');
    busy(btn,async()=>{try{await api('poke',{text:v});$('poke').value='';clear('pokeErr','poke');toast('已私下傳給老師');}
      catch(error){fail('pokeErr','poke',error.message);}});
  }else if(form.id==='setForm'){
    const name=$('gname').value.trim(),forward=+$('fwd').value,change={};
    if(name!==S.info.course)change.name=name;
    if(forward!==S.info.forward)change.forward=forward;
    const w1=$('week1').value;if(w1&&w1!==S.info.week1)change.week1=w1;
    if(!Object.keys(change).length)return toast('沒有需要儲存的變更');
    if(change.name!==undefined&&name.length<2)return fail('gnameErr','gname','群組名稱至少要兩個字。');
    busy(btn,async()=>{try{const r=await api('saveSettings',change);
        if(r.name!==undefined){S.info.course=r.name;$('gname').value=r.name;}if(r.forward!==undefined)S.info.forward=r.forward;
        if(r.week1!==undefined){S.info.week1=r.week1;S.info.week1Auto=r.week1Auto;}
        S.courses=null;header();clear('gnameErr','gname');toast('設定已儲存');if(r.week1!==undefined)render();}
      catch(error){fail('gnameErr','gname',error.message);}});
  }
});

$('unpreview').addEventListener('click',()=>{S.preview=false;S.tab='set';header();render();main.focus({preventScroll:true});});

// ---------- start ----------
function loadSdk(){return new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://static.line-scdn.net/liff/edge/2/sdk.js';s.onload=ok;s.onerror=()=>fail(Object.assign(new Error('LINE 元件載入失敗，請檢查網路。'),{code:'network'}));document.head.append(s);});}
async function boot(tab){
  $('demo').hidden=!DEMO;skeleton();
  try{
    if(!DEMO&&!auth.idToken){
      if(!window.liff)await loadSdk();
      await liff.init({liffId:CFG.liffId});
      if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
      auth.idToken=liff.getIDToken();
      auth.course=new URLSearchParams(location.search).get('c')||'';
      if(!auth.course)throw Object.assign(new Error('請從課堂群組的「備份」選單開啟這個頁面。'),{code:'no_course'});
    }
    S.info=await api('init');
    // ?tab=me from the menu's nickname line; only a tab this person has.
    // The teacher has no 我的 tab: their nickname is in 設定, so ?tab=me opens it there.
    const asked=QUERY.get('tab'),own=TABS[S.info.teacher?'teacher':'student'].map(t=>t[0]);
    // ?tab=poke from the menu's 私下戳戳老師: a student lands on 我的 with the poke box ready. The
    // teacher has no poke of their own, so they land in the student preview there, to see what students see.
    const toNick=!tab&&asked==='me'&&S.info.teacher,toPoke=!tab&&asked==='poke';
    if(toPoke&&S.info.teacher)S.preview=true;
    S.tab=tab||(toNick?'set':toPoke?'me':own.includes(asked)?asked:S.info.teacher?'home':'log');
    header();main.removeAttribute('aria-busy');$('tabs').hidden=false;render();
    if(toNick){const f=$('nickForm');f.scrollIntoView({block:'center'});$('nick').focus({preventScroll:true});}
    if(toPoke){const f=$('pokeForm');f.scrollIntoView({block:'center'});$('poke').focus({preventScroll:true});}
  }catch(error){
    main.removeAttribute('aria-busy');$('tabs').hidden=true;
    if(!error.code)error=Object.assign(new Error('無法開啟頁面：'+error.message),{code:'network'});
    main.innerHTML=problem(error,'boot');
  }
}
