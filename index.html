<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>課堂頁面</title>
<!--
  備份機器人的課堂頁面（LIFF）。
  學生：歷程／檔案／我的（含改暱稱、戳戳老師）。老師：總覽／歷程（可廣播）／檔案／繳交／設定。
  資料全部來自 GAS 的 ?api=liff 接口（src/liffApi.js、src/liffActions.js）；這個頁面本身不含任何 token，
  誰是老師、誰能看什麼都由後端決定。
  config.js 未填、或網址帶 ?demo（老師版：?demo=teacher）時，以假資料示範，不連 LINE 也不連 GAS。
-->
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
</head>
<body>
<div class="demo" id="demo" role="note" hidden>示範模式・假資料，不會真的傳送任何訊息</div>
<div class="demo" id="preview" role="note" hidden>以學生身分預覽中：老師功能已關閉，資料是你自己的。學生看不到這個畫面。<button type="button" class="linkbtn" id="unpreview">回到老師畫面</button></div>
<header class="top"><h1><span id="course">課堂頁面</span><small id="who"></small></h1></header>
<main id="main" tabindex="-1"></main>
<nav class="tabs" id="tabs" aria-label="主要分頁" hidden></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="overlay"></div>

const auth={idToken:'',course:''};

async function realApi(action,body={}){
  const stop=new AbortController(),timer=setTimeout(()=>stop.abort(),action==='summaryRefresh'?270000:25000);
  let reply;
  try{
    // text/plain keeps this a "simple" request: GAS web apps cannot answer a CORS preflight.
    const res=await fetch(CFG.api+'?api=liff',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({...body,action,idToken:auth.idToken,course:auth.course}),signal:stop.signal,redirect:'follow'});
    reply=await res.json();
  }catch(error){throw Object.assign(new Error(error.name==='AbortError'?'等太久了，機器人沒有回應。':'連不上機器人，請檢查網路。'),{code:'network'});}
  finally{clearTimeout(timer);}
  if(!reply.ok)throw Object.assign(new Error(reply.message||'發生錯誤'),{code:reply.error,retryAt:reply.retryAt});
  return reply.data;
}

// ---------- demo: the same contract as the server, over made-up rows ----------

const today=taipei();

const FAKE=[
 [0,'10:42','林柏宇','file','第三組_訪談逐字稿.docx'],[0,'10:40','陳語彤','text','老師，我們第二組的簡報已經上傳了，再麻煩確認'],
 [0,'10:38','陳語彤','file','第二組_串流平台比較.pdf'],[0,'10:21','王子晴','image','圖片'],

 [-1,'18:02','李宜蓁','video','影片'],[-2,'14:20','陳語彤','text','分享一篇講串流平台分潤的報導 https://example.com/streaming-revenue-share-2026'],
 [-2,'14:05','黃品叡','image','圖片'],[-3,'11:48','王子晴','file','第一組_企劃書v2.pdf'],[-3,'11:30','林柏宇','text','第三組下週三可以先跟老師約時間討論嗎？'],
].map((r,i,a)=>({row:9+a.length-i,day:taipei(r[0]),time:r[1],who:r[2],type:r[3],text:r[4],upload:r[3]!=='text',mine:r[2]===(QUERY.get('demo')==='teacher'?'老師':'陳語彤')}));
const demo={teacher:QUERY.get('demo')==='teacher',nick:QUERY.get('demo')==='teacher'?'老師':'陳語彤',name:'媒體產業研究',forward:-1,course:'a'};
const DEMO_COURSES=[['a','媒體產業研究',0,'10:42'],['b','數位敘事工作坊',-1,'16:05'],['c','傳播理論',-4,'09:30']];
const demoSummaryRefreshes=new Map();
function demoSummaries(){
  const current=monday(today),week1=demo.week1||monday(taipei(-66)),weeks=[],minMessages=5;
  const speakers=['陳語彤','林柏宇','老師','張家豪','王子晴','李宜蓁','黃品叡','許宥安','何亭妤','周宇辰','蔡欣妤','楊承翰'];
  for(let day=current,i=0;day>=week1;day=summaryDay(day,-7),i++){
    const days=(i===0?[38,86,21,124,8,0,5]:i%4===1?[2,0,2,0,0,0,0]:[12,47,119,64,18,0,3])
      .map((n,k)=>summaryDay(day,k)>today?null:n);
    const messages=days.reduce((sum,n)=>sum+n,0),peakIndex=days.indexOf(Math.max(...days));
    const low=messages<minMessages,first=summaryDate(day),last=summaryDate(i===0?summaryDay(day,Math.min(2,daysUntil(day,today))):summaryDay(day,2));
    const timeline=low?[]:[
      {from:first+' 09:05',to:first+' 10:25',topic:'比較訂閱與廣告分潤',who:speakers.slice(0,8)},
      {from:last+' 13:10',to:last+' 14:45',topic:'確認訪談分工與時間碼',who:[...speakers.slice(2,4),...speakers.slice(8)]}
    ];
    const lines=low?[
      {time:first+' 09:05',who:'陳語彤',text:'老師，下週的訪談可以改成線上嗎？'},
      {time:first+' 09:15',who:'老師',text:'可以，請先確認受訪者方便的時間。'},
      {time:last+' 14:05',who:'林柏宇',text:'我們這組先把問題整理在共筆。'},
      {time:last+' 14:12',who:'陳語彤',text:'收到，我晚點補上訪綱。'}
    ]:[];
    const people=low?['陳語彤','老師','林柏宇'].map(who=>({who,count:lines.filter(line=>line.who===who).length,
      spans:lines.filter(line=>line.who===who).map(line=>({day:line.time.slice(0,5),from:line.time.slice(6),to:line.time.slice(6)})),
      repliesTo:{},repliedBy:{},mentions:{},topics:[],related:[]})):
      speakers.map((who,j)=>({who,count:Math.floor(messages/speakers.length)+(j<messages%speakers.length?1:0),
        spans:[{day:j<8?first:last,from:j<8?'09:05':'13:10',to:j<8?'10:25':'14:45'}],
        repliesTo:j===3?{'老師':3}:{},repliedBy:j===2?{'張家豪':3}:{},
        mentions:j===0?{'林柏宇':1}:{},topics:[['訂閱與廣告分潤','會員收入案例','時間碼標法','逐字稿格式',
          '平台公開資料','訪談分工','樣本篩選','創作者拆帳','訪談提綱','逐字稿校對','期末簡報','台灣平台案例'][j]],
        related:j===0?[{who:'楊承翰',why:'兩人都引用台灣平台的分潤案例'}]:[]}));
    const ai=low?null:{
      themes:[
        {title:'串流平台分潤',share:46,from:first,to:last,note:'比較訂閱拆帳與廣告分潤，並討論創作者能取得哪些資料。'},
        {title:'小組訪談與逐字稿',share:34,from:first,to:last,note:'各組確認訪談分工、逐字稿格式和時間碼標法。'},
        {title:'案例與資料來源',share:20,from:first,to:last,note:'整理台灣串流平台案例，討論不同來源的數字如何對照。'}
      ],
      questions:['訂閱平台會公開每一部作品的分潤方式嗎？','訪談逐字稿需要逐句標示時間嗎？'],
      open:['還缺一個能對照會員收入與廣告收入的台灣案例。'],
      quotes:[{who:'張家豪',text:'請問逐字稿需要標時間碼嗎？'},{who:'老師',text:'不用逐句標，每段開頭標一次就可以。'}],
      next:i===0?'':'下週可帶著各組整理出的分潤案例，對照平台與創作者取得的資料。'
    };
    const latest=demoSummaryRefreshes.get(demo.course);
    weeks.push({monday:day,w:'W'+(1+(Date.parse(day)-Date.parse(week1))/6048e5),
      range:summaryDate(day)+'–'+summaryDate(summaryDay(day,6)),kind:i===0?'live':'final',low,
      stats:{messages,people:people.length,days,peak:{day:summaryDay(day,peakIndex),hour:low?9:14,count:low?2:Math.ceil(days[peakIndex]/3)}},
      ai,people,timeline,lines,model:low?null:i===0?'gpt-6-luna':'gpt-6.2-sol',
      made:latest?.weeks.get(day)||(i===0?new Date(Date.now()-3600e3).toISOString():summaryDay(day,7)+'T00:00:00.000Z'),error:null});
  }
  return {configured:true,week1,today,minMessages,weeks};
}
async function demoApi(action,b={}){
  await new Promise(r=>setTimeout(r,500));
  if((!demo.teacher||b.asStudent)&&['overview','handin','courses','saveSettings','broadcast','meetSave','meetSend','meetCreate','summaries','summaryRefresh'].includes(action))
    throw Object.assign(new Error('這個功能只有老師能用。'),{code:'teacher_only'});
  const pub=({...r})=>r;
  switch(action){
    case 'init':return {course:DEMO_COURSES.find(c=>c[0]===demo.course)[1]===DEMO_COURSES[0][1]?demo.name:DEMO_COURSES.find(c=>c[0]===demo.course)[1],
      nickname:demo.nick,teacher:demo.teacher,version:'示範',week1:demo.week1||monday(taipei(-66)),...(demo.teacher?{forward:demo.forward,week1Auto:!demo.week1,week1Start:taipei(-66)}:{})};
    case 'me':{const m=FAKE.filter(r=>r.mine);return {messages:m.filter(r=>!r.upload).length,files:m.filter(r=>r.upload).length,last:{day:m[0].day,time:m[0].time}};}
    case 'file':return {name:FAKE.find(r=>r.row===b.row).text,url:''};
    case 'overview':{const t=FAKE.filter(r=>r.day===today);
      return {today:{messages:t.filter(r=>!r.upload).length,uploads:t.filter(r=>r.upload).length,people:new Set(t.map(r=>r.who)).size,last:t[0].time},
        week:[-6,-5,-4,-3,-2,-1,0].map(d=>({day:taipei(d),count:FAKE.filter(r=>r.day===taipei(d)).length})),
        meet:demo.meet||'',roster:DEMO_PEOPLE.map((who,i)=>{const a=FAKE.filter(r=>r.who===who);return {person:i+3,who,messages:a.filter(r=>!r.upload).length,files:a.filter(r=>r.upload).length,last:a[0]?{day:a[0].day,time:a[0].time}:null};})
          .sort((x,y)=>y.messages+y.files-x.messages-x.files)};}
    case 'handin':{const done=[],missing=[];DEMO_PEOPLE.forEach((who,i)=>{const r=FAKE.find(x=>x.who===who&&x.upload&&x.day>=b.from&&x.day<=b.to);
      r?done.push({person:i+3,who,file:r.text,day:r.day,time:r.time}):missing.push({person:i+3,who});});return {from:b.from,to:b.to,done,missing};}
    case 'courses':return DEMO_COURSES.map(c=>({code:c[0],name:c[0]==='a'?demo.name:c[1],current:c[0]===demo.course,last:{day:taipei(c[2]),time:c[3]}}));
    case 'nickname':if(String(b.name).trim().length<2)throw Object.assign(new Error('暱稱至少要兩個字。'),{code:'invalid'});{const old=demo.nick;demo.nick=b.name.trim();FAKE.forEach(r=>{if(r.mine)r.who=demo.nick;});DEMO_PEOPLE[0]=demo.nick;return {nickname:demo.nick,records:FAKE.filter(r=>r.mine).length*(old!==demo.nick),replies:0};}
    case 'poke':return {sent:true};
    case 'saveSettings':if(b.name!=null)demo.name=b.name;if(b.forward!=null)demo.forward=b.forward;if(b.week1!=null)demo.week1=b.week1&&monday(b.week1);return {name:demo.name,forward:demo.forward,...(b.week1!=null?{week1:demo.week1||monday(taipei(-66)),week1Auto:!demo.week1}:{})};
    case 'broadcast':return {sent:b.rows.length};
    case 'meetSave':{const m=/^(?:https?:\/\/)?meet\.google\.com\/([a-z]{3}-[a-z]{4}-[a-z]{3})(?:[/?#].*)?$/i.exec(String(b.url||'').trim());
      if(String(b.url||'').trim()===''){demo.meet='';return {meet:''};}
      if(!m)throw Object.assign(new Error('請貼上 Google Meet 的會議連結，例如 https://meet.google.com/abc-defg-hij'),{code:'invalid'});
      demo.meet='https://meet.google.com/'+m[1].toLowerCase();return {meet:demo.meet};}
    case 'meetCreate':{const r=n=>[...Array(n)].map(()=>'abcdefghijklmnopqrstuvwxyz'[Math.floor(Math.random()*26)]).join('');
      demo.meet=`https://meet.google.com/${r(3)}-${r(4)}-${r(3)}`;return {meet:demo.meet};}
    case 'meetSend':if(!demo.meet)throw Object.assign(new Error('請先存一個 Google Meet 連結。'),{code:'invalid'});return {sent:true};
    case 'summaries':return demoSummaries();
    case 'summaryRefresh':{
      const day=b.monday||monday(today);
      const updated=demoSummaries().weeks.find(w=>w.monday===day);
      if(!updated)throw Object.assign(new Error('請選擇這學期已開始的週次。'),{code:'bad_request'});
      const latest=demoSummaryRefreshes.get(demo.course)||{retry:0,weeks:new Map()};
      if(Date.now()<latest.retry)throw Object.assign(new Error('這堂課每 10 分鐘可手動更新一次。'),
        {code:'rate_limited',retryAt:new Date(latest.retry).toISOString()});
      updated.made=new Date().toISOString();latest.weeks.set(day,updated.made);
      latest.retry=Date.now()+600000;demoSummaryRefreshes.set(demo.course,latest);
      return updated;
    }
    default:if(typeof demoRoll==='function'){const r=demoRoll(action,b);if(r!==undefined)return r;}
  }
  const q=(b.q||'').trim().toLowerCase(),size=5,start=b.offset||0,person=b.person!=null?DEMO_PEOPLE[b.person-3]:'';
  const f=FAKE.filter(r=>(!b.mine||r.mine)&&(!person||r.who===person)&&(b.kind!=='text'||r.type==='text')&&(b.kind!=='upload'||r.upload)&&(b.kind!=='doc'||r.type==='file')
    &&(b.kind!=='media'||(r.upload&&r.type!=='file'))&&(!q||(r.text+r.who).toLowerCase().includes(q)));
  const items=f.slice(start,start+size).map(pub);
  return {total:f.length,items,next:start+items.length<f.length?start+items.length:null};
}
// While the teacher previews the student view, the server applies the student rules too.
const api=(action,body={})=>(DEMO?demoApi:realApi)(action,S.preview?{...body,asStudent:true}:body);

// ---------- state ----------
const S={preview:false,tab:'log',q:'',kind:'all',fileKind:'upload',person:null,select:false,picked:new Map(),range:'this',from:'',to:'',info:null,courses:null};
// Five tabs at most: the teacher finds files through 歷程's 檔案與圖片 filter.
const TABS={student:[['log','歷程','list'],['files','檔案','folder'],['roll','點名','pin'],['me','我的','user']],
            teacher:[['home','總覽','chart'],['log','歷程','list'],['roll','點名','pin'],['hand','繳交','check2'],['set','設定','gear']]};
const FORWARD=[[0,'即時'],[120,'每 2 小時'],[360,'每 6 小時'],[720,'每 12 小時'],[1440,'每天一次'],[-1,'暫停']];
let seq=0;                       // a slow answer must not overwrite a newer screen
const dayLabel=d=>d===today?'今天':d.slice(0,4)===today.slice(0,4)?d.slice(5):d;
// Semester week: W1 is the week of info.week1 (a Monday), worked out by the server per class.
const monday=d=>{const t=new Date(d+'T00:00:00Z');return new Date(t-((t.getUTCDay()+6)%7)*864e5).toISOString().slice(0,10);};
const week=d=>{const w1=S.info&&S.info.week1;if(!w1||d<w1)return '';return 'W'+(Math.round((Date.parse(monday(d))-Date.parse(w1))/864e5/7)+1);};
const dayWeek=d=>dayLabel(d)+(week(d)?`<span class="wk">${week(d)}</span>`:'');
const when=t=>t?dayLabel(t.day)+' '+t.time:'—';

function toast(text,icon='ok'){const t=$('toast');t.innerHTML=ic(icon)+`<span>${esc(text)}</span>`;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),4000);}
// The teacher may look at the student tabs; the server still knows it is the teacher.
const asTeacher=()=>S.info.teacher&&!S.preview;
function header(){$('course').textContent=S.info.course;document.title=S.info.course+'・課堂頁面';
  $('who').textContent=asTeacher()?'老師檢視':(S.info.nickname||'尚未設定暱稱')+'（你）';$('preview').hidden=!S.preview;}
function tabs(){$('tabs').innerHTML=TABS[asTeacher()?'teacher':'student'].map(([id,label,icon])=>`<button type="button" data-tab="${id}" ${id===S.tab?'aria-current="page"':''}>${ic(icon)}<span>${label}</span></button>`).join('');}
function skeleton(target=main,heights=[56,56,56,56]){target.setAttribute('aria-busy','true');target.innerHTML='<p class="sr">載入中</p>'+heights.map(h=>`<div class="sk" style="height:${h}px;margin-bottom:12px"></div>`).join('');}
const chip=(group,value,label,cur)=>`<button type="button" class="chip" data-${group}="${value}" aria-pressed="${cur===value}">${label}</button>`;
const empty=(text,action='')=>`<div class="empty">${ic('inbox')}<div>${text}</div>${action}</div>`;
// A refusal the person cannot fix by retrying gets no retry button.
function problem(error,retry){
  const final=['not_member','no_course','not_configured','bad_token','not_open','teacher_only'].includes(error.code);
  return `<div class="empty" role="alert">${ic('alert')}<div>${esc(error.message)}</div>${final?'':`<button type="button" class="btn" data-retry="${retry}">再試一次</button>`}</div>`;
}
// Runs a slow action from a button: locks it, shows progress, restores it.
async function busy(btn,work){const label=btn.innerHTML;btn.disabled=true;btn.textContent='處理中…';try{return await work();}finally{btn.disabled=false;btn.innerHTML=label;}}

// ---------- lists (歷程, 檔案, 我的紀錄) ----------
function row(m){
  const body=m.upload?`<div class="filebox">${ic(m.type)}<span>${esc(m.text)}</span></div>`:`<div class="text">${esc(m.text)}</div>`;
  const box=S.select?`<input class="check" type="checkbox" data-pick="${m.row}" data-label="${esc(m.who+'：'+m.text)}" ${S.picked.has(m.row)?'checked':''} aria-label="選取 ${esc(m.who)} ${m.time} 的訊息">`:'';
  return `<li>${box}<div class="grow"><div class="meta"><b>${esc(m.who||'（未設定暱稱）')}</b><span class="num">${m.time}</span>${m.mine?'<span>我</span>':''}</div>${body}</div>
    ${m.upload&&!S.select?`<button type="button" class="btn" data-get="${m.row}" data-name="${esc(m.text)}">${ic('down')}取回</button>`:''}</li>`;
}
function grouped(items,lastDay){
  let out='',day=lastDay||'';
  items.forEach(m=>{if(m.day!==day){if(out)out+='</ul>';day=m.day;out+=`<div class="day">${dayWeek(day)}</div><ul class="list">`;}else if(!out)out+='<ul class="list">';out+=row(m);});
  return out+(out?'</ul>':'');
}
const more=data=>data.next===null?'':`<button type="button" class="btn block" style="margin-top:16px" data-more="${data.next}">載入更早的紀錄</button>`;
async function fillList(box,params,emptyText){
  const mine=++seq;skeleton(box);
  try{
    const data=await api('log',params);if(mine!==seq)return;
    box.removeAttribute('aria-busy');
    box.innerHTML=`<p class="hint" aria-live="polite">共 ${data.total} 則</p>`+(data.items.length?grouped(data.items):empty(emptyText))+more(data);
    box.dataset.params=JSON.stringify(params);box.dataset.lastDay=data.items.length?data.items.at(-1).day:'';
  }catch(error){if(mine!==seq)return;box.removeAttribute('aria-busy');box.innerHTML=problem(error,'view');}
}
const logParams=()=>({q:S.q,kind:S.kind,...(S.person?{person:S.person.id}:{})});
const LOG_EMPTY='找不到符合的訊息。試試較短的關鍵字，或清除篩選。';
function actionbar(){
  const old=document.querySelector('.actionbar');if(old)old.remove();
  if(S.tab!=='log'||!S.select)return;
  main.insertAdjacentHTML('beforeend',`<div class="actionbar"><span>已選 ${S.picked.size} 則（最多 5 則）</span><button type="button" class="btn primary" data-cast ${S.picked.size?'':'disabled'}>${ic('send')}廣播</button></div>`);
}

// The summary screens stay inside the teacher's 總覽 tab.
const SUMMARY_DAYS='一二三四五六日';
const SUMMARY_SETUP='尚未設定 OpenAI 金鑰：到 Apps Script 專案設定的指令碼屬性加入 OPENAI_API_KEY';
const summaryDay=(day,offset)=>new Date(Date.parse(day)+offset*864e5).toISOString().slice(0,10);
const summaryDate=day=>day.slice(5,10).replace('-','/');
const summaryTime=iso=>new Date(Date.parse(iso)+8*3600e3).toISOString().slice(0,16).replace('T',' ');
const summaryLive=w=>w.monday===monday(S.summaryData.today);
const summaryProgress=()=>'<span class="tag ok summary-progress">進行中</span>';
const summaryBadge=()=>'<span class="tag summary-badge">AI 摘要</span>';

function summaryStats(w){
  const {messages,people,days,peak}=w.stats,max=Math.max(1,...days);
  const label=days.map((n,i)=>`週${SUMMARY_DAYS[i]} ${n===null?'尚未到':n+' 則'}`).join('，');
  return `<div class="tiles summary-stats">
    <div class="tile"><div class="k">訊息</div><div class="v">${messages} <small>則</small></div></div>
    <div class="tile"><div class="k">發言人數</div><div class="v">${people} <small>人</small></div></div>
    </div>
    <div class="summary-heat" role="img" aria-label="${esc(w.w+' 每日訊息數：'+label)}">
      ${days.map((n,i)=>`<div class="${n===null?'future':n/max>=.7?'high':n/max>=.25?'mid':n?'low':''}">
        <span>${SUMMARY_DAYS[i]}</span><strong class="num">${n??'—'}</strong></div>`).join('')}
    </div>
    ${peak.count?`<p class="hint">尖峰 週${SUMMARY_DAYS[daysUntil(w.monday,peak.day)]} ${String(peak.hour).padStart(2,'0')}:00（${peak.count} 則）</p>`:''}
    <p class="hint">數字由程式從歷程計算，不經過 AI</p>`;
}
const daysUntil=(from,to)=>(Date.parse(to)-Date.parse(from))/864e5;

function summaryTimeline(timeline){
  if(!timeline.length)return '';
  return `<section class="summary-section summary-timeline">
    <div class="summary-heading"><h3>本週時間軸</h3>${summaryBadge()}</div>
    <ol class="summary-rows">${timeline.map(({from,to,topic,who})=>{
      const range=from===to?from:from+'–'+(from.slice(0,5)===to.slice(0,5)?to.slice(6):to);
      const names=who.slice(0,6).map(name=>name||'（未設定暱稱）').join('、')+(who.length>6?' 等 '+who.length+' 人':'');
      return `<li><div class="meta num">${esc(range)}</div><strong>${esc(topic)}</strong>
        ${names?`<div class="meta">${esc(names)}</div>`:''}</li>`;
    }).join('')}</ol></section>`;
}

function summaryPeople(people){
  if(!people.length)return '';
  return `<section class="summary-section summary-people">
    <div class="summary-heading"><h3>誰說了什麼</h3><small class="hint">由歷程計算</small></div>
    <ul class="summary-rows" id="summaryPeople">${people.map((person,i)=>{
      const {who,count,spans,repliesTo,repliedBy,mentions,topics,related}=person;
      const interactions=[
        ...Object.entries(repliesTo).map(([name,n])=>`回覆 ${name} ${n} 次`),
        ...Object.entries(repliedBy).map(([name,n])=>`被 ${name||'（未設定暱稱）'} 回覆 ${n} 次`),
        ...Object.keys(mentions).map(name=>'提到 @'+name)
      ];
      const times=spans.map(({day,from,to})=>day+' '+from+(from===to?'':'–'+to)).join('、');
      return `<li${i>=8?' data-summary-extra hidden':''}>
        <div class="meta"><b>${esc(who||'（未設定暱稱）')}</b><span class="num">${count} 則</span>
          <span class="num">${esc(times)}</span></div>
        ${topics.length?`<p>${summaryBadge()} ${esc(topics.join('、'))}</p>`:''}
        ${interactions.length?`<p class="hint">互動・${esc(interactions.join('、'))}</p>`:''}
        ${related.length?`<p><span class="tag summary-badge summary-inference">AI 推測</span> 可能相關・${related
          .map(({who,why})=>esc((who||'（未設定暱稱）')+'（'+why+'）')).join('、')}</p>`:''}
      </li>`;
    }).join('')}</ul>
    ${people.length>8?`<button type="button" class="btn block summary-expand" data-summary-all="${people.length}"
      aria-controls="summaryPeople" aria-expanded="false">顯示全部 ${people.length} 人</button>`:''}
    </section>`;
}

function summaryLow(w){
  return `<div class="summary-section summary-low">
    <p>本週只有 ${w.stats.messages} 則，直接列出：</p>
    ${w.lines.length?`<ul class="summary-rows">${w.lines.map(({time,who,text})=>
      `<li><div class="meta"><span class="num">${esc(time)}</span><b>${esc(who||'（未設定暱稱）')}</b></div>
        <div class="text">${esc(text)}</div></li>`).join('')}</ul>`:'<p class="hint">這週沒有符合條件的純文字訊息。</p>'}</div>`;
}

function summaryAi(ai,full){
  const list=(label,items)=>`<div class="summary-section"><h3>${label}</h3>
    ${items.length?`<ul>${items.map(text=>`<li>${esc(text)}</li>`).join('')}</ul>`:'<p class="hint">—</p>'}</div>`;
  return `<div class="summary-ai${full?' summary-ai-compact':''}">
    <div class="summary-heading"><h3>主題與約略占比</h3>${summaryBadge()}</div>
    <ul class="summary-topics">${ai.themes.map(t=>`<li>
      <div class="summary-topic"><strong>${esc(t.title)}</strong><span class="num">約 ${t.share}%</span>
        <span class="hint num">${esc(t.from===t.to?t.from:t.from+'–'+t.to)}</span></div>
      <div class="summary-ratio" role="img" aria-label="${esc(t.title+' 約占 '+t.share+'%')}"><i style="width:${Number(t.share)}%"></i></div>
      ${full?`<p class="hint">${esc(t.note)}</p>`:''}</li>`).join('')}</ul>
    ${full?list('關鍵問題',ai.questions)+list('還沒解決',ai.open)+`
      <div class="summary-section"><h3>留下來的發言</h3>
        ${ai.quotes.length?ai.quotes.map(q=>`<blockquote><p>「${esc(q.text)}」</p><footer>${esc(q.who||'（未設定暱稱）')}</footer></blockquote>`).join(''):'<p class="hint">—</p>'}
      </div>
      <div class="summary-section"><h3>下週可以接續</h3><p>${esc(ai.next||'—')}</p></div>`:''}
    </div>`;
}

function summaryCard(w,full=false){
  const {configured,today}=S.summaryData,current=summaryLive(w),ai=configured?w.ai:null;
  const refresh=configured&&(!w.low||full);
  return `<section class="card summary-card">
    <div class="summary-heading"><div><h2>${current?`本週至今 <span class="wk">${esc(w.w)}</span>`:esc(w.w)+' 摘要'}</h2>
      <div class="meta num">${esc(w.range)}${current?'（截至 '+summaryDate(today)+'）':''}</div></div>
      ${current?summaryProgress():''}</div>
    ${summaryStats(w)}
    ${full&&ai?summaryTimeline(w.timeline):''}
    ${full&&!w.low?summaryPeople(w.people):''}
    ${ai?summaryAi(ai,full):''}
    ${!full?`<p class="hint summary-message">本週 ${w.stats.people} 人發言</p>`+(ai?summaryTimeline(w.timeline.slice(0,2)):''):''}
    ${w.low?summaryLow(w):''}
    ${!configured?`<p class="hint summary-message">${SUMMARY_SETUP}</p>`:''}
    ${configured&&w.error?`<p class="err summary-message" role="alert">${esc(w.error)}${ai?' 下方時間為上次成功產生的時間。':''}</p>`:''}
    ${configured&&!w.low&&!ai&&!w.error?'<p class="hint summary-message">摘要尚未產生。</p>':''}
    ${ai&&w.made?`<p class="hint summary-message">${esc(w.model)}・${current?'最後更新':'產生時間'} <time class="num" datetime="${esc(w.made)}">${summaryTime(w.made)}</time></p>`:''}
    ${refresh||!full?`<div class="summary-actions">
      ${refresh?`<button type="button" class="btn primary" data-summary-refresh="${esc(w.monday)}">${w.low?'更新歷程片段':current?'更新本週摘要':'重新產生'}</button>`:''}
      ${!full?`<button type="button" class="btn" data-summary-view="${esc(w.monday)}">看完整摘要</button>
        <button type="button" class="btn" data-summary-view="weeks">各週摘要 ›</button>`:''}
    </div>`:''}
    </section>`;
}

function summaryScreen(){
  const {weeks,configured,minMessages}=S.summaryData,view=S.summaryView;
  const returnButton=(target,label)=>`<button type="button" class="btn summary-return" data-summary-view="${target}">‹ ${label}</button>`;

async function refreshSummary(day,btn){
  const mine=seq,label=btn.innerHTML;
  btn.disabled=true;btn.setAttribute('aria-busy','true');
  btn.innerHTML='<span class="summary-spinner" aria-hidden="true"></span>產生中…';
  try{
    const w=await api('summaryRefresh',{monday:day});
    if(mine!==seq)return;
    const weeks=S.summaryData.weeks;
    weeks[weeks.findIndex(item=>item.monday===w.monday)]=w;
    S.summaryView?summaryScreen():summaryHome();
    main.querySelector('[data-summary-refresh]')?.focus({preventScroll:true});
    if(w.error)toast(w.error,'alert');
    else toast(w.low?'已更新歷程片段':summaryLive(w)?'本週摘要已更新':'固定版已重新產生');
  }catch(error){
    if(mine!==seq)return;
    const message=error.code==='rate_limited'&&error.retryAt?error.message+' 請於 '+summaryTime(error.retryAt)+' 後再按。'
      :error.code==='not_configured'?SUMMARY_SETUP:error.message;
    toast(message,'alert');
  }finally{
    btn.disabled=false;btn.removeAttribute('aria-busy');btn.innerHTML=label;
  }
}

function summaryRefreshClick(day,btn){
  const w=S.summaryData.weeks.find(item=>item.monday===day);
  if(w.low||summaryLive(w)){refreshSummary(day,btn);return;}
  const close=sheet(`<h3 id="sheetTitle">重新產生固定版？</h3>
    <p class="hint">新摘要產生後會取代 ${esc(w.w)} 的固定版。</p>
    <div class="row"><button type="button" class="btn" data-close>取消</button>
    <button type="button" class="btn primary" id="summaryConfirm">重新產生</button></div>`);
  $('summaryConfirm').addEventListener('click',()=>{close();refreshSummary(day,btn);});
}

// Monday-to-Sunday weeks, on Taipei days.
function range(){
  const weekday=(new Date(today+'T00:00:00Z').getUTCDay()+6)%7;
  if(S.range==='today')return [today,today];
  if(S.range==='this')return [taipei(-weekday),today];
  if(S.range==='last')return [taipei(-weekday-7),taipei(-weekday-1)];
  return [S.from||taipei(-6),S.to||today];
}

function sheet(html){
  const back=document.activeElement;
  $('overlay').innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">${html}</div></div>`;
  const onKey=e=>{if(e.key==='Escape')close();};
  function close(){$('overlay').innerHTML='';document.removeEventListener('keydown',onKey);if(back&&back.isConnected)back.focus();}
  document.addEventListener('keydown',onKey);
  $('overlay').querySelector('.scrim').addEventListener('click',e=>{if(e.target.classList.contains('scrim')||e.target.closest('[data-close]'))close();});
  const first=$('overlay').querySelector('input,button');if(first)first.focus();
  return close;
}
async function castDialog(){

    if(!S.courses)S.courses=await api('courses');if(!$('castTargets'))return;

      :'<p class="hint">沒有其他群組可以廣播。</p>';

    // The teacher has no 我的 tab: their nickname is in 設定, so ?tab=me opens it there.
    const asked=QUERY.get('tab'),own=TABS[S.info.teacher?'teacher':'student'].map(t=>t[0]);
    // ?tab=poke from the menu's 私下戳戳老師: a student lands on 我的 with the poke box ready. The
    // teacher has no poke of their own, so they land in the student preview there, to see what students see.
    const toNick=!tab&&asked==='me'&&S.info.teacher,toPoke=!tab&&asked==='poke';
    if(toPoke&&S.info.teacher)S.preview=true;
    S.tab=tab||(toNick?'set':toPoke?'me':own.includes(asked)?asked:S.info.teacher?'home':'log');
    header();main.removeAttribute('aria-busy');$('tabs').hidden=false;render();
    if(toNick){const f=$('nickForm');f.scrollIntoView({block:'center'});$('nick').focus({preventScroll:true});}
    if(toPoke){const f=$('pokeForm');f.scrollIntoView({block:'center'});$('poke').focus({preventScroll:true});}
  }catch(error){
    main.removeAttribute('aria-busy');$('tabs').hidden=true;
    if(!error.code)error=Object.assign(new Error('無法開啟頁面：'+error.message),{code:'network'});
    main.innerHTML=problem(error,'boot');
  }
}
</script>
<script src="roll.js"></script>
<script>boot();</script>
</body>
</html>
